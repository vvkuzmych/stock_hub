syntax = "proto3";

package stock_hub;

option go_package = "stock_hub/api/proto;proto";

import "google/protobuf/timestamp.proto";

// User represents a registered user
message User {
  int64 id = 1;
  string username = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
}

// Message represents a communication record
message Message {
  int64 id = 1;
  string content = 2;
  string client_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

// OrderType represents the type of order
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_BID = 1;  // Buy order
  ORDER_TYPE_ASK = 2;  // Sell order
}

// StockOrder represents a bid or ask order
message StockOrder {
  int64 id = 1;
  int64 user_id = 2;
  string username = 3;
  string symbol = 4;
  OrderType order_type = 5;
  double price = 6;
  int32 quantity = 7;
  string status = 8;  // "open", "filled", "cancelled"
  google.protobuf.Timestamp created_at = 9;
}
