version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stock_hub_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stock_hub_network

volumes:
  postgres_data:
    driver: local

networks:
  stock_hub_network:
    driver: bridge
